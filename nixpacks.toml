# Coolify Laravel deployment with Nixpacks
# See: https://coolify.io/docs/applications/laravel

[phases.setup]
aptPkgs = ["supervisor", "nginx"]

[phases.install]
cmds = [
    "mkdir -p /var/log/nginx /var/cache/nginx /var/log/supervisor /tmp /etc/nginx /etc/supervisor/conf.d",
    "mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs",
    "chmod -R 775 bootstrap/cache storage",
    "composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --ignore-platform-reqs"
]

[phases.build]
cmds = [
    "npm ci || npm install || true",
    "npm run production || npm run build || true",
    "rm -rf node_modules"
]

[start]
cmd = "/assets/start.sh"

[staticAssets]
"start.sh" = '''
#!/bin/bash
# DO NOT use "set -e" — a single failed command must NOT kill the whole container
# Every command that can fail must use || true

# ── Ensure all required directories exist ────────────────────────────────────
mkdir -p \
    /var/log/nginx /var/cache/nginx \
    /var/log/supervisor \
    /var/run /tmp \
    /etc/nginx /etc/supervisor/conf.d \
    /app/bootstrap/cache \
    /app/storage/framework/cache \
    /app/storage/framework/sessions \
    /app/storage/framework/views \
    /app/storage/logs

# ── Set umask to ensure group writeability ────────────────────────────────────
umask 0002

# ── Permissions before artisan runs ──────────────────────────────────────────
chown -R www-data:www-data /app/storage /app/bootstrap/cache /var/log /var/run 2>/dev/null || true
chmod -R 775 /app/bootstrap/cache /app/storage /tmp /var/log /var/cache /var/run /var/log/nginx /var/log/supervisor 2>/dev/null || true

# ── Copy supervisor assets to configuration paths ─────────────────────────────
cp /assets/worker-*.conf /etc/supervisor/conf.d/ 2>/dev/null || true
cp /assets/supervisord.conf /etc/supervisord.conf 2>/dev/null || true

# ── Substitute PORT in nginx template (safe fallback to 80) ──────────────────
PORT=${PORT:-80}
if [ -f /assets/nginx.template.conf ]; then
    sed "s/__PORT__/$PORT/g" /assets/nginx.template.conf > /etc/nginx/nginx.conf 2>/dev/null || true
fi

# ── Laravel runtime bootstrap ─────────────────────────────────────────────────
cd /app

# Clear stale bootstrap caches from previous deployment
php artisan config:clear   2>/dev/null || true
php artisan cache:clear    2>/dev/null || true
php artisan route:clear    2>/dev/null || true
php artisan view:clear     2>/dev/null || true

# Re-cache for performance
php artisan config:cache   2>/dev/null || true
php artisan route:cache    2>/dev/null || true

# Run pending database migrations
php artisan migrate --force 2>/dev/null || true

# ── Re-apply ownership AFTER artisan. Never rm/truncate logs. ────────────────
touch /app/storage/logs/laravel.log 2>/dev/null || true
chown -R www-data:www-data /app/storage /app/bootstrap/cache 2>/dev/null || true
chmod -R 775 /app/storage /app/bootstrap/cache 2>/dev/null || true
chmod 664 /app/storage/logs/laravel.log 2>/dev/null || true

# ── Start supervisor in foreground to keep container alive ───────────────────
exec supervisord -c /etc/supervisord.conf -n
'''

"supervisord.conf" = '''
[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisord]
logfile=/var/log/supervisord.log
logfile_maxbytes=50MB
logfile_backups=5
loglevel=info
pidfile=/tmp/supervisord.pid
nodaemon=true
silent=false
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[include]
files = /etc/supervisor/conf.d/*.conf
'''

"worker-phpfpm.conf" = '''
[program:worker-phpfpm]
process_name=%(program_name)s_%(process_num)02d
command=php-fpm -y /assets/php-fpm.conf -F
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/worker-phpfpm.log
stderr_logfile=/var/log/worker-phpfpm.log
'''

"worker-nginx.conf" = '''
[program:worker-nginx]
process_name=%(program_name)s_%(process_num)02d
command=nginx -c /etc/nginx/nginx.conf -g 'daemon off;'
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/worker-nginx.log
stderr_logfile=/var/log/worker-nginx.log
'''

"worker-laravel-default.conf" = '''
[program:worker-laravel-default]
process_name=%(program_name)s_%(process_num)02d
command=php /app/artisan queue:work --queue=default --sleep=3 --tries=3 --max-time=3600 --memory=256
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
startsecs=1
startretries=10
stopwaitsecs=3600
stdout_logfile=/var/log/worker-laravel-default.log
stderr_logfile=/var/log/worker-laravel-default.log
'''

"worker-laravel-video.conf" = '''
[program:worker-laravel-video]
process_name=%(program_name)s_%(process_num)02d
command=php /app/artisan queue:work --queue=video-encoding --sleep=10 --tries=1 --max-time=7200 --memory=384
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
startsecs=1
startretries=10
stopwaitsecs=7200
stdout_logfile=/var/log/worker-laravel-video.log
stderr_logfile=/var/log/worker-laravel-video.log
'''

"worker-scheduler.conf" = '''
[program:worker-scheduler]
process_name=%(program_name)s
command=php /app/artisan schedule:work
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
priority=30
stdout_logfile=/var/log/worker-scheduler.log
stderr_logfile=/var/log/worker-scheduler.log
'''

"php-fpm.conf" = '''
[global]
error_log = /var/log/worker-phpfpm.log
log_level = notice
daemonize = no

[www]
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 16
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
request_terminate_timeout = 60s
clear_env = no
catch_workers_output = yes
php_admin_value[post_max_size] = 50M
php_admin_value[upload_max_filesize] = 50M
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 60
'''

"nginx.template.conf" = '''
worker_processes auto;
daemon off;

worker_rlimit_nofile 8192;

events {
  worker_connections 1024;
}

http {
    types {
        text/html                             html htm shtml;
        text/css                              css;
        text/xml                              xml;
        image/gif                             gif;
        image/jpeg                            jpeg jpg;
        application/javascript                js;
        application/json                      json;
        image/png                             png;
        image/svg+xml                         svg svgz;
        image/webp                            webp;
        image/x-icon                          ico;
        application/pdf                       pdf;
        font/woff                             woff;
        font/woff2                            woff2;
        font/ttf                              ttf;
        application/octet-stream              bin exe dll deb dmg iso img msi msp msm;
    }

    default_type application/octet-stream;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx-access.log;
    error_log /var/log/nginx-error.log;
    sendfile on;
    tcp_nopush on;
    server_names_hash_bucket_size 128;

    server {
        listen __PORT__ default_server;
        listen [::]:__PORT__ default_server;
        server_name _;

        root /app/public;

        add_header X-Content-Type-Options "nosniff";
        client_max_body_size 50M;

        index index.php index.html index.htm;
        charset utf-8;

        location = /api/health/live {
            access_log off;
            default_type application/json;
            add_header Content-Type application/json always;
            return 200 '{"status":"alive","via":"nginx"}';
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        location /internal-media/ {
            internal;
            alias /app/storage/app/;
            gzip off;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_param REQUEST_METHOD $request_method;
            fastcgi_param CONTENT_TYPE $content_type;
            fastcgi_param CONTENT_LENGTH $content_length;
            fastcgi_param SCRIPT_NAME $fastcgi_script_name;
            fastcgi_param REQUEST_URI $request_uri;
            fastcgi_param DOCUMENT_URI $document_uri;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_param SERVER_PROTOCOL $server_protocol;
            fastcgi_param REQUEST_SCHEME $scheme;
            fastcgi_param HTTPS $https if_not_empty;
            fastcgi_param GATEWAY_INTERFACE CGI/1.1;
            fastcgi_param SERVER_SOFTWARE nginx/$nginx_version;
            fastcgi_param REMOTE_ADDR $remote_addr;
            fastcgi_param REMOTE_PORT $remote_port;
            fastcgi_param SERVER_ADDR $server_addr;
            fastcgi_param SERVER_PORT $server_port;
            fastcgi_param SERVER_NAME $server_name;
            fastcgi_index index.php;
            fastcgi_read_timeout 65;
            fastcgi_buffer_size 128k;
            fastcgi_buffers 4 256k;
            fastcgi_busy_buffers_size 256k;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
'''
