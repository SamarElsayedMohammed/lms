[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=20MB
logfile_backups=3
pidfile=/var/run/supervisord.pid
loglevel=warn

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ─── PHP-FPM ──────────────────────────────────────────────────────────────────
[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ─── Nginx ────────────────────────────────────────────────────────────────────
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ─── Laravel Queue Worker (default) ──────────────────────────────────────────
; --max-time=3600  : Worker restarts itself every 1 hour (prevents memory leaks)
; --memory=128     : Worker stops if it exceeds 128MB RAM (Supervisor restarts it)
; --sleep=5        : Wait 5s between polls when no jobs (reduces CPU idle load)
; --tries=3        : Max 3 attempts per job before marking as failed
; startretries=3   : Only restart 3 times if it keeps crashing (not infinite loop)
; stopwaitsecs=60  : Give it 60s to finish current job before force-killing
[program:default-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work --queue=default --sleep=5 --tries=3 --max-time=3600 --memory=128
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
startsecs=5
startretries=3
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; ─── Laravel Queue Worker (video encoding) ────────────────────────────────────
; --max-time=7200  : 2 hours max per worker lifecycle (ffmpeg jobs can be long)
; --memory=384     : Lower than 512 to avoid RAM exhaustion on shared server
; --sleep=10       : Poll less often (video jobs are rare)
; numprocs=1       : Only ONE video worker at a time to avoid CPU overload
; stopwaitsecs=120 : Give ffmpeg time to finish current encoding before kill
[program:video-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work --queue=video-encoding --sleep=10 --tries=1 --max-time=7200 --memory=384
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
startsecs=5
startretries=3
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; ─── Laravel Scheduler ────────────────────────────────────────────────────────
; Replaces the need for a cron job — runs every 60 seconds
[program:scheduler]
command=bash -c "while true; do php /var/www/html/artisan schedule:run --no-ansi >> /dev/null 2>&1; sleep 60; done"
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[include]
files = /etc/supervisor/conf.d/*.conf
