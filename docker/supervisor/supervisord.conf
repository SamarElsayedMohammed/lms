[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=20MB
logfile_backups=3
pidfile=/var/run/supervisord.pid
loglevel=warn

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ─── PHP-FPM ──────────────────────────────────────────────────────────────────
[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ─── Nginx ────────────────────────────────────────────────────────────────────
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ─── One-shot migrate/cache AFTER nginx is listening (must not block PID 1) ───
[program:laravel-boot]
command=/bin/bash -c "su -s /bin/bash www-data -c 'php artisan config:cache || true; php artisan route:cache || true; php artisan migrate --force || true'; supervisorctl start default-worker:* ingestion-worker:* video-worker:* scheduler || true"
directory=/var/www/html
user=root
autostart=true
autorestart=false
startsecs=0
startretries=1
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ─── Laravel Queue Worker (default) ──────────────────────────────────────────
; --max-time=3600  : Worker restarts itself every 1 hour (prevents memory leaks)
; --memory=128     : bounded default-work queue memory on a 2 GB host
; --sleep=5        : Wait 5s between polls when no jobs (reduces CPU idle load)
; --tries=3        : Max 3 attempts per job before marking as failed
; autostart=false  : laravel-boot starts workers after cache and migrations finish
; startretries=10  : Resilient recovery if temporary DB/Redis outage at boot
; stopwaitsecs=3600: Must exceed longest default-queue job (FCM timeout 3600)
[program:default-worker]
process_name=%(program_name)s_%(process_num)02d
command=php -d memory_limit=128M /var/www/html/artisan queue:work --queue=default --sleep=5 --tries=3 --max-time=3600 --memory=128
user=www-data
autostart=false
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
startsecs=5
startretries=10
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; ─── Laravel Queue Worker (knowledge ingestion) ──────────────────────────────
; One process prevents large parsing/embedding jobs from competing for memory.
; The 7200s timeout remains below queue.php retry_after=7300 to prevent overlap.
; --memory=192: Ingestion is capped below the FPM pool to preserve host headroom.
[program:ingestion-worker]
process_name=%(program_name)s_%(process_num)02d
command=php -d memory_limit=192M /var/www/html/artisan queue:work --queue=ingestion --sleep=5 --tries=3 --timeout=7200 --max-time=7200 --max-jobs=1 --memory=192
user=www-data
autostart=false
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
startsecs=5
startretries=10
stopwaitsecs=7250
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; ─── Laravel Queue Worker (video encoding) ────────────────────────────────────
; --max-time=7200  : 2 hours max per worker lifecycle (ffmpeg jobs can be long)
; --memory=160     : Encoding worker memory is capped on the shared host
; --sleep=10       : Poll less often (video jobs are rare)
; numprocs=1       : Only ONE video worker at a time to avoid CPU overload
; stopwaitsecs=7200: Must exceed ffmpeg job timeout; 120s SIGKILLs in-flight encodes
[program:video-worker]
process_name=%(program_name)s_%(process_num)02d
command=php -d memory_limit=160M /var/www/html/artisan queue:work --queue=video-encoding --sleep=10 --tries=1 --max-time=7200 --memory=160
user=www-data
autostart=false
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
startsecs=5
startretries=10
stopwaitsecs=7200
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; ─── Laravel Scheduler ────────────────────────────────────────────────────────
; Native Laravel daemon for containerized scheduling with process group management
[program:scheduler]
process_name=%(program_name)s
command=php -d memory_limit=128M /var/www/html/artisan schedule:work
user=www-data
autostart=false
autorestart=true
stopasgroup=true
killasgroup=true
startsecs=5
startretries=10
priority=40
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; ─── Optional conf.d includes (directory is intentionally empty) ──────────────
; [include]
; files = /etc/supervisor/conf.d/*.conf
