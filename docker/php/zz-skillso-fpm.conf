[global]
error_log = /proc/self/fd/2
log_level = notice

[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

; Tuned for shared / low-RAM Coolify hosts.
; max_children=2 × 128 M = 256 MB peak on the shared 2 GB server.
; max_requests=200 recycles workers to release any slow memory leaks.
pm = dynamic
; Two PHP workers leave headroom for queue workers, the scheduler, nginx,
; and the Coolify-managed database on the shared 2 GB host.
pm.max_children = 2
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 2
pm.max_requests = 200

request_terminate_timeout = 60s
catch_workers_output = yes
decorate_workers_output = no
clear_env = no

php_admin_value[memory_limit] = 128M
php_admin_value[max_execution_time] = 60
php_admin_value[post_max_size] = 50M
php_admin_value[upload_max_filesize] = 50M
