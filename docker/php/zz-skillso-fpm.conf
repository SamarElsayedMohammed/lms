[global]
error_log = /proc/self/fd/2
log_level = notice

[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

; Tuned for high-reliability workload on 2GB VPS:
; max_children=8 with dynamic scaling (2 idle servers = ~70 MB, peak 8 workers = ~320 MB)
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 500

php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 3600
php_admin_value[max_input_time] = 3600
php_admin_value[max_file_uploads] = 40
php_admin_value[post_max_size] = 8192M
php_admin_value[upload_max_filesize] = 2048M
request_terminate_timeout = 3600s
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
